{"id": "client-server-model-diagnostic", "skill": "client-server-model", "review_status": "draft", "questions": [{"id": "csm-d1", "prompt": "Which statement about a stateless HTTP server is correct?", "options": [{"value": "each", "label": "Each request must carry the information needed to handle it"}, {"value": "memory", "label": "The server remembers the previous request automatically"}, {"value": "order", "label": "Requests are guaranteed to arrive in order"}], "correct_answer": "each", "explanation": "Statelessness means the server does not retain client context between requests."}, {"id": "csm-d2", "prompt": "A page hides an admin button for non-admin users. Is the admin action protected?", "options": [{"value": "no", "label": "No, the server must still reject unauthorised requests"}, {"value": "yes", "label": "Yes, because the button cannot be clicked"}, {"value": "partly", "label": "Yes, as long as the page is minified"}], "correct_answer": "no", "explanation": "Anything enforced only in the client can be bypassed by sending the request directly."}]}