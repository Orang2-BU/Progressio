skills:
  - id: program-control-flow
    title: Program Control Flow
    competency: programming-fundamentals
    description: Express program decisions, repetition and explicit failure paths from stated inputs.
    difficulty: Beginner
    estimated_learning_hours: 5
    learning_outcomes:
      - Construct conditional and loop logic for a stated rule.
      - Return or raise a defined outcome for invalid input.
    prerequisites: []
    why_it_matters: Backend endpoints are programs that must make correct decisions for both expected and invalid requests.
    resources: [python-control-flow, python-tutorial, exercism-python]
    assessments: [program-control-flow-assessment]
    evidence: [source-code, terminal-output]
  - id: functions-and-modules
    title: Functions and Modules
    competency: programming-fundamentals
    description: Separate behavior into functions and modules with clear inputs, outputs and dependencies.
    difficulty: Beginner
    estimated_learning_hours: 6
    learning_outcomes:
      - Define functions with explicit arguments and return values.
      - Organize a small feature across modules without circular imports.
    prerequisites: [program-control-flow]
    why_it_matters: API behavior becomes difficult to change or review when all concerns are placed in one handler.
    resources: [python-control-flow, python-tutorial, exercism-python]
    assessments: [functions-and-modules-assessment]
    evidence: [source-tree, dependency-explanation]
  - id: git-change-workflow
    title: Git Change Workflow
    competency: programming-fundamentals
    description: Use working tree, staging area and commits to create reviewable changes.
    difficulty: Beginner
    estimated_learning_hours: 3
    learning_outcomes:
      - Inspect a diff before staging.
      - Create a focused commit.
      - Recover a local uncommitted mistake safely.
    prerequisites: []
    why_it_matters: Backend work is collaborative and production changes must have traceable intent.
    resources: [pro-git-basics, pro-git-recording]
    assessments: [git-change-workflow-assessment]
    evidence: [repository-history, git-diff-status-capture]
  - id: client-server-model
    title: Client-Server Model
    competency: backend-web-foundations
    description: Model how a client requests a resource or operation and how a server returns a result.
    difficulty: Beginner
    estimated_learning_hours: 4
    learning_outcomes:
      - Identify client, server, request, response and resource in an interaction.
      - Explain why HTTP requests are independently interpretable.
    prerequisites: []
    why_it_matters: API design choices only make sense when the boundary between caller and service is explicit.
    resources: [mdn-client-server, mdn-http-overview]
    assessments: [client-server-model-assessment]
    evidence: [annotated-request-response-diagram]
  - id: http-messages-and-semantics
    title: HTTP Messages and Semantics
    competency: backend-web-foundations
    description: Construct and interpret HTTP request and response messages, methods, headers and status codes.
    difficulty: Beginner
    estimated_learning_hours: 8
    learning_outcomes:
      - Interpret a request line, headers and body.
      - Select a method and status code whose semantics match an operation.
      - Construct a response that distinguishes success from client error.
    prerequisites: [client-server-model]
    why_it_matters: HTTP semantics are the interoperability contract between an API and every consumer.
    resources: [mdn-http-messages, rfc-9110, mdn-http-status]
    assessments: [http-messages-and-semantics-assessment]
    evidence: [corrected-request-response, rationale]
  - id: api-contract-design
    title: API Contract Design
    competency: api-development
    description: Translate a bounded use case into documented API operations, inputs, outputs and error cases.
    difficulty: Intermediate
    estimated_learning_hours: 7
    learning_outcomes:
      - Define a resource-oriented operation.
      - Document parameters, request body and responses in an OpenAPI description.
      - Identify one success and one client-error response per operation.
    prerequisites: [functions-and-modules, http-messages-and-semantics]
    why_it_matters: A contract lets clients, backend developers and tools agree on behavior before implementation.
    resources: [openapi-spec, mdn-http-methods]
    assessments: [api-contract-design-assessment]
    evidence: [openapi-document, operation-rationale]
  - id: api-input-validation
    title: API Input Validation
    competency: api-development
    description: Define syntactic and semantic input rules and communicate invalid requests predictably.
    difficulty: Intermediate
    estimated_learning_hours: 6
    learning_outcomes:
      - Distinguish syntactic from semantic invalidity.
      - Implement validation at an API boundary.
      - Return a documented client-error response without exposing internals.
    prerequisites: [api-contract-design]
    why_it_matters: API boundaries receive untrusted input; early validation protects downstream behavior and makes failures usable for consumers.
    resources: [owasp-input-validation, rfc-9110]
    assessments: [api-input-validation-assessment]
    evidence: [validation-rules, response-examples, source-code]

