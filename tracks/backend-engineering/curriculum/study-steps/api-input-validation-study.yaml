{"id": "api-input-validation-study", "skill": "api-input-validation", "review_status": "draft", "steps": [{"id": "aiv-s1", "resource": "owasp-input-validation", "anchor": "", "prompt": "Read the input validation cheat sheet, then list every externally supplied input in your API and what a valid value looks like.", "checkpoint_question": "What is the name of the strategy the cheat sheet recommends, where only known-good values are accepted?", "checkpoint_answer": "allow-list", "estimated_minutes": 40}, {"id": "aiv-s2", "resource": "rfc-9110", "anchor": "#status.400", "prompt": "Read the definition of 400 Bad Request, then make your API reject each invalid input with an appropriate status and message.", "checkpoint_question": "Which status class must be returned when the fault is in the client's request?", "checkpoint_answer": "4xx", "estimated_minutes": 40}]}