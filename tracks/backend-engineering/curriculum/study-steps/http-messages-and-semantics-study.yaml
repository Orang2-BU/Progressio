{"id": "http-messages-and-semantics-study", "skill": "http-messages-and-semantics", "review_status": "draft", "steps": [{"id": "hms-s1", "resource": "mdn-http-messages", "anchor": "", "prompt": "Read the anatomy of requests and responses, then annotate a real request with its start line, headers and body.", "checkpoint_question": "Which part of an HTTP response carries the status code?", "checkpoint_answer": "status line", "estimated_minutes": 30}, {"id": "hms-s2", "resource": "mdn-http-status", "anchor": "", "prompt": "Read the status code reference, then decide the correct status for: a created resource, a malformed body, and a missing path.", "checkpoint_question": "Which status code means the request created a new resource?", "checkpoint_answer": "201", "estimated_minutes": 30}, {"id": "hms-s3", "resource": "rfc-9110", "anchor": "#name-idempotent-methods", "prompt": "Read the definition of idempotent methods, then explain why retrying a failed PUT is safe but retrying a POST may not be.", "checkpoint_question": "Name one HTTP method that is idempotent but not safe.", "checkpoint_answer": "PUT", "estimated_minutes": 40}]}