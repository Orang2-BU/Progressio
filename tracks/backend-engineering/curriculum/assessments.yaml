assessments:
  - {id: program-control-flow-assessment, skill: program-control-flow, type: coding-challenge, objective: Express stated normal and invalid paths., expected_evidence: [source-code, terminal-output], mastery_criteria: All stated cases produce the specified outcome and invalid input follows an explicit path.}
  - {id: functions-and-modules-assessment, skill: functions-and-modules, type: practical-exercise, objective: Decompose one feature into functions and modules., expected_evidence: [source-tree, dependency-explanation], mastery_criteria: Functions have explicit inputs and outputs module dependencies have no cycle and behavior is preserved.}
  - {id: git-change-workflow-assessment, skill: git-change-workflow, type: practical-exercise, objective: Record a focused change safely., expected_evidence: [repository-history, git-diff-status-capture], mastery_criteria: Commit contains only the stated change and learner can identify staged versus unstaged work.}
  - {id: client-server-model-assessment, skill: client-server-model, type: quiz, objective: Interpret a client-server exchange., expected_evidence: [annotated-request-response-diagram], mastery_criteria: Correctly labels client server resource request and response and explains request independence.}
  - {id: http-messages-and-semantics-assessment, skill: http-messages-and-semantics, type: debugging-task, objective: Diagnose an incorrect HTTP exchange., expected_evidence: [corrected-request-response, rationale], mastery_criteria: Method status headers and body align with the stated operation and outcome.}
  - {id: api-contract-design-assessment, skill: api-contract-design, type: mini-project, objective: Specify a small API before implementation., expected_evidence: [openapi-document, operation-rationale], mastery_criteria: Contract defines operation input success response and client-error response and references valid HTTP semantics.}
  - {id: api-input-validation-assessment, skill: api-input-validation, type: coding-challenge, objective: Define and enforce boundary validation., expected_evidence: [validation-rules, response-examples, source-code], mastery_criteria: Separates syntactic from semantic rules rejects invalid input with a documented client-error response and does not expose internals.}

