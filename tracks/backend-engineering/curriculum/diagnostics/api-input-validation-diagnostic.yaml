{"id": "api-input-validation-diagnostic", "skill": "api-input-validation", "review_status": "draft", "questions": [{"id": "aiv-1", "prompt": "Which validation strategy is preferred?", "options": [{"value": "allow", "label": "Allow-list: accept only what is known to be valid"}, {"value": "deny", "label": "Deny-list: reject known-bad values"}, {"value": "escape", "label": "Neither; escape the value at the point of use"}], "correct_answer": "allow", "explanation": "A deny-list can only block what was anticipated; an allow-list rejects everything not explicitly permitted."}, {"id": "aiv-2", "prompt": "The browser already validates the form. Must the server validate too?", "options": [{"value": "yes", "label": "Yes, the client can be bypassed entirely"}, {"value": "no", "label": "No, that would duplicate the work"}, {"value": "sometimes", "label": "Only for authenticated users"}], "correct_answer": "yes", "explanation": "Client validation is a usability feature; the server is the only place a rule can actually be enforced."}]}