{"id": "http-messages-and-semantics-diagnostic", "skill": "http-messages-and-semantics", "review_status": "draft", "questions": [{"id": "hms-1", "prompt": "Which method is idempotent?", "options": [{"value": "put", "label": "PUT"}, {"value": "post", "label": "POST"}, {"value": "neither", "label": "Neither"}], "correct_answer": "put", "explanation": "Repeating the same PUT leaves the resource in the same state; repeating a POST may create duplicates."}, {"id": "hms-2", "prompt": "A client sends a malformed body. Which status class is correct?", "options": [{"value": "4xx", "label": "4xx, a client error"}, {"value": "5xx", "label": "5xx, a server error"}, {"value": "2xx", "label": "2xx with an error message in the body"}], "correct_answer": "4xx", "explanation": "The fault is in the request, so the response must not report success nor blame the server."}, {"id": "hms-3", "prompt": "What does 201 Created indicate that 200 OK does not?", "options": [{"value": "new", "label": "A new resource was created as a result of the request"}, {"value": "cache", "label": "The response may be cached"}, {"value": "auth", "label": "The request was authenticated"}], "correct_answer": "new", "explanation": "201 carries the specific meaning that the request resulted in a new resource."}]}