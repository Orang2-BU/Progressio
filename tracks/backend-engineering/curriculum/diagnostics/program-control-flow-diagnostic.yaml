{"id": "program-control-flow-diagnostic", "skill": "program-control-flow", "review_status": "draft", "questions": [{"id": "pcf-1", "prompt": "A function receives a list that may be empty. What must the control flow do first?", "options": [{"value": "guard", "label": "Check for the empty case before indexing"}, {"value": "index", "label": "Read the first element and handle the error later"}, {"value": "ignore", "label": "Assume the list always has items"}], "correct_answer": "guard", "explanation": "Guarding the empty case first prevents an index error and makes the normal path unconditional."}, {"id": "pcf-2", "prompt": "Which loop construct fits 'repeat until the user enters a valid value'?", "options": [{"value": "while", "label": "A while loop with a condition"}, {"value": "for", "label": "A for loop over a fixed range"}, {"value": "none", "label": "No loop; call the function twice"}], "correct_answer": "while", "explanation": "The number of attempts is unknown ahead of time, which is exactly what a condition-driven loop expresses."}]}