{"id": "git-change-workflow-diagnostic", "skill": "git-change-workflow", "review_status": "draft", "questions": [{"id": "gcw-1", "prompt": "You fixed a bug and reformatted an unrelated file. How should this be committed?", "options": [{"value": "two", "label": "As two separate commits"}, {"value": "one", "label": "As one commit, since it was one session of work"}, {"value": "none", "label": "Not committed until the feature is complete"}], "correct_answer": "two", "explanation": "One intentional change per commit keeps history reviewable and lets either change be reverted alone."}, {"id": "gcw-2", "prompt": "What belongs in a commit message beyond what changed?", "options": [{"value": "why", "label": "Why the change was made"}, {"value": "who", "label": "Who reviewed it"}, {"value": "when", "label": "When it will be deployed"}], "correct_answer": "why", "explanation": "The diff already shows what changed; the reason is the part that cannot be recovered later."}]}