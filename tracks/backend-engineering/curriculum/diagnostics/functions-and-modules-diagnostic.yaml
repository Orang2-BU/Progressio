{"id": "functions-and-modules-diagnostic", "skill": "functions-and-modules", "review_status": "draft", "questions": [{"id": "fam-1", "prompt": "A function both calculates a total and prints a report. What does this indicate?", "options": [{"value": "split", "label": "It has two responsibilities and should be split"}, {"value": "fine", "label": "It is fine because both relate to the same feature"}, {"value": "global", "label": "It should read its input from a global variable instead"}], "correct_answer": "split", "explanation": "Separating calculation from presentation lets the calculation be tested and reused independently."}, {"id": "fam-2", "prompt": "Why prefer a return value over mutating a global variable?", "options": [{"value": "explicit", "label": "The dependency becomes explicit and the function is testable in isolation"}, {"value": "faster", "label": "Returning is always faster at runtime"}, {"value": "shorter", "label": "It always produces shorter code"}], "correct_answer": "explicit", "explanation": "Explicit inputs and outputs make behaviour predictable and remove hidden coupling between modules."}]}