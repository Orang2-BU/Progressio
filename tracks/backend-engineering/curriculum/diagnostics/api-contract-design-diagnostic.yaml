{"id": "api-contract-design-diagnostic", "skill": "api-contract-design", "review_status": "draft", "questions": [{"id": "acd-1", "prompt": "Which path best identifies a collection of orders for a customer?", "options": [{"value": "res", "label": "/customers/{id}/orders"}, {"value": "verb", "label": "/getCustomerOrders?id={id}"}, {"value": "flat", "label": "/data?type=orders&customer={id}"}], "correct_answer": "res", "explanation": "Resource-oriented paths name things; the HTTP method supplies the action."}, {"id": "acd-2", "prompt": "How many responses should an operation document at minimum?", "options": [{"value": "two", "label": "One success and one client-error response"}, {"value": "one", "label": "Only the success response"}, {"value": "all", "label": "Every status code defined by HTTP"}], "correct_answer": "two", "explanation": "A contract that only describes success leaves the consumer unable to handle failure."}]}