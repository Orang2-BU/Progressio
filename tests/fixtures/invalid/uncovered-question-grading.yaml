{"assessment": "client-server-model-assessment", "review_status": "draft", "mode": "rules", "passing_score": 70, "max_score": 100, "estimated_minutes": 30, "questions": [{"id": "csm-1", "prompt": "A browser requests a page and a server returns HTML. Which side initiates the exchange?", "options": [{"value": "client", "label": "The client"}, {"value": "server", "label": "The server"}, {"value": "both", "label": "Both simultaneously"}]}, {"id": "csm-2", "prompt": "Which work belongs on the server rather than the client in a server-side rendered application?", "options": [{"value": "db", "label": "Reading from the database"}, {"value": "hover", "label": "Highlighting a button on hover"}, {"value": "scroll", "label": "Smooth scrolling"}]}, {"id": "csm-3", "prompt": "What does a web server return when the requested path does not exist?", "options": [{"value": "404", "label": "A 404 response"}, {"value": "200", "label": "A 200 response with empty body"}, {"value": "nothing", "label": "No response at all"}]}, {"id": "csm-4", "prompt": "Two users load the same page at the same time. How does the server handle this?", "options": [{"value": "separate", "label": "It handles each request independently"}, {"value": "queue", "label": "The second user must wait for the first to log out"}, {"value": "shared", "label": "Both users share one response object"}]}, {"id": "csm-5", "prompt": "Where must a rule such as 'only the owner may delete this record' be enforced?", "options": [{"value": "server", "label": "On the server"}, {"value": "client", "label": "In the browser, by hiding the button"}, {"value": "either", "label": "Either one is equally safe"}]}, {"id": "csm-6", "prompt": "What is the role of DNS when a client makes a request to example.com?", "options": [{"value": "resolve", "label": "It resolves the host name to an IP address"}, {"value": "encrypt", "label": "It encrypts the request body"}, {"value": "cache", "label": "It stores the returned HTML"}]}, {"id": "csm-7", "prom