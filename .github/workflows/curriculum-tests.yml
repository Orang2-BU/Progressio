name: Curriculum tests

on:
  push:
    paths:
      - "curriculum/**"
      - ".github/workflows/curriculum-tests.yml"
  pull_request:
    paths:
      - "curriculum/**"
      - ".github/workflows/curriculum-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every curriculum package and fixture
        run: python -m unittest discover -s curriculum -t . -v
