name: Curriculum tests

on:
  push:
    paths:
      - "tracks/backend-engineering/**"
      - "schemas/**"
      - "scripts/validate_curriculum.py"
      - "tests/**"
  pull_request:
    paths:
      - "tracks/backend-engineering/**"
      - "schemas/**"
      - "scripts/validate_curriculum.py"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
