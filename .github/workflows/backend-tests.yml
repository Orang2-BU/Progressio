name: Backend tests

on:
  push:
    paths:
      - "back-end/**"
      - "curriculum/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "back-end/**"
      - "curriculum/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    env:
      # SQLite keeps CI free of a database service; PostgreSQL is used at runtime.
      DB_ENGINE: sqlite
      AI_PROVIDER: mock
      BLOCKCHAIN_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
      - name: Validate the OpenAPI schema
        run: python manage.py spectacular --fail-on-warn --file /dev/null
      - name: Import every curriculum package
        run: |
          python manage.py migrate
          python manage.py import_curriculum
