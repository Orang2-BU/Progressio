name: Backend tests

on:
  push:
    paths:
      - "back-end/**"
      - "curriculum/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "back-end/**"
      - "curriculum/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    env:
      APP_ENV: local
      # SQLite keeps CI free of a database service; PostgreSQL is used at runtime.
      DB_ENGINE: sqlite
      AI_PROVIDER: mock
      BLOCKCHAIN_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
      - name: Validate the OpenAPI schema
        run: python manage.py spectacular --fail-on-warn --file /dev/null
      - name: Import every curriculum package
        run: |
          python manage.py migrate
          python manage.py import_curriculum

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: progressio_ci
          POSTGRES_USER: progressio
          POSTGRES_PASSWORD: progressio_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U progressio -d progressio_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: back-end
    env:
      APP_ENV: local
      DB_ENGINE: postgresql
      DB_NAME: progressio_ci
      DB_USER: progressio
      DB_PASSWORD: progressio_ci
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      AI_PROVIDER: mock
      BLOCKCHAIN_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests with PostgreSQL 15
        run: python manage.py test
